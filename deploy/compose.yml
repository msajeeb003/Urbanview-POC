# UrbanView on one server (Hetzner Cloud): Caddy (HTTPS) in front of the public map, the API and
# the file bucket; worker, PostGIS, Redis and MinIO on the internal network only (no host ports).
#
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#
# Settings: deploy/.env (copy deploy/.env.example). Step by step: deploy/README.md.
name: urbanview

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-staging}
  DATABASE_URL: postgresql+asyncpg://urbanview:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/urbanview
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: https://${FILES_DOMAIN:?set FILES_DOMAIN}
  S3_BUCKET: ${S3_BUCKET:-urbanview}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  S3_USE_PATH_STYLE: "true"
  CORS_ORIGINS: https://${SITE_DOMAIN:?set SITE_DOMAIN}
  # Caddy is the only way in: client addresses come from X-Forwarded-For (rate limiting)
  TRUST_PROXY_HEADERS: "true"
  ORDER_PUBLIC_BASE_URL: https://${SITE_DOMAIN}
  ADMIN_BASE_URL: https://${SITE_DOMAIN}/admin   # magic links open /admin/login?token=…
  # the search box's geocoder: the photon service below (the country's OpenStreetMap addresses,
  # answers in milliseconds); GEOCODER_BASE_URL=https://photon.komoot.io in .env uses the public
  # instance instead (1-3 s per answer, fair use)
  GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-photon}
  GEOCODER_BASE_URL: ${GEOCODER_BASE_URL:-http://photon:2322}
  GEOCODER_TIMEOUT_MS: ${GEOCODER_TIMEOUT_MS:-1500}

x-app-build: &app-build
  context: ..
  dockerfile: backend/Dockerfile

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
      # the server's public IPv4: http://IP forwards to the map (127.0.0.1 = unused)
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # extra site blocks (redirects from the names the site had before a domain move):
      # deploy/caddy.d/*.caddy, see legacy.caddy.example
      - ./caddy.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - minio

  # Public map (frontend/Dockerfile). NEXT_PUBLIC_* are baked into the browser bundle at build time:
  # change them in .env, then rebuild (`deploy/deploy.sh` does).
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        NEXT_PUBLIC_MAPBOX_STYLE: ${NEXT_PUBLIC_MAPBOX_STYLE:-mapbox://styles/mapbox/light-v11}
        NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED:-true}
        NEXT_PUBLIC_DEFAULT_LANG: ${NEXT_PUBLIC_DEFAULT_LANG:-en}
    restart: unless-stopped
    environment:
      # server-side fetches (profile, tile pointer, the admin console) go straight to the API container
      API_INTERNAL_BASE_URL: http://api:8000
      # the admin console's sign-in (Auth.js): the secret encrypts the session cookie
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/.env (openssl rand -base64 32)}
      AUTH_URL: https://${SITE_DOMAIN}
      AUTH_TRUST_HOST: "true"
      AUTH_SESSION_MAX_AGE: ${AUTH_SESSION_MAX_AGE:-86400}
      # temporary: set = the console opens without sign-in (frontend/src/lib/admin/open-access.ts)
      ADMIN_OPEN_ACCESS_TOKEN: ${ADMIN_OPEN_ACCESS_TOKEN:-}
    depends_on:
      - api

  # One-shot: applies Alembic migrations before the api / worker start (every `up`).
  migrate:
    build: *app-build
    command: alembic -c /app/database/alembic.ini upgrade head
    env_file: .env
    environment: *app-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *app-build
    command: >
      uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
      --proxy-headers --forwarded-allow-ips=*
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery on every queue: extraction, geometry, publish (tippecanoe), e-mail.
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile.worker
    command: celery -A jobs.celery_app worker --loglevel=info --concurrency=2 -Q default,extraction,geo,publish,email
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: urbanview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: urbanview
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanview -d urbanview"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Private bucket for planning PDFs, map tile archives and expert reports. Browsers only ever get
  # short-lived signed links (https://FILES_DOMAIN/…, through Caddy). Built from source
  # (deploy/minio/Dockerfile): MinIO publishes no free images any more.
  minio:
    build:
      context: ./minio
    image: urbanview-minio
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # PDF.js and PMTiles read with Range requests from the map's origin
      MINIO_API_CORS_ALLOW_ORIGIN: https://${SITE_DOMAIN}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Geocoder for the search box (deploy/photon): Photon over the country's OpenStreetMap dump,
  # imported on the first start (about a minute) and refreshed every PHOTON_REIMPORT_DAYS.
  # Internal only; the API reads it at GEOCODER_BASE_URL. A down geocoder never breaks the map:
  # search answers an empty list until it is back.
  photon:
    build:
      context: ./photon
    image: urbanview-photon
    restart: unless-stopped
    environment:
      PHOTON_DUMP_URL: ${PHOTON_DUMP_URL:-https://download1.graphhopper.com/public/europe/montenegro/photon-dump-montenegro-1.0-latest.jsonl.zst}
      PHOTON_REIMPORT_DAYS: ${PHOTON_REIMPORT_DAYS:-30}
      JAVA_OPTS: ${PHOTON_JAVA_OPTS:--Xms256m -Xmx768m}
    volumes:
      - photondata:/photon/data

  # One-shot: creates the bucket (private) with the app's own storage code (every `up`).
  storage-init:
    build: *app-build
    command: >
      python -c "from core.config import get_settings; from core.storage import ObjectStorage;
      ObjectStorage(get_settings()).ensure_bucket(); print('bucket ready')"
    env_file: .env
    environment: *app-env
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  miniodata:
  photondata:
