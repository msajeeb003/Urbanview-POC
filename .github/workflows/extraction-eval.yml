# Extraction regression check: runs the AI extraction on the evaluation corpus whenever the
# prompts, the extraction schema or the code that feeds the model changes, scores it against the
# gold sets (backend/tests/corpus) and fails on any hallucinated value, any new wrong page
# citation, or an accuracy drop below backend/tests/corpus/baseline.json.
#
# Secrets (repository settings -> Secrets and variables -> Actions):
#   ANTHROPIC_API_KEY    the Claude API key used for the extraction calls
#   CORPUS_ARCHIVE_URL   a private, time-limited link to a zip of the corpus PDFs laid out like
#                        docs/gis/source/ (the client's documents never enter the repository;
#                        corpus.toml pins each file's sha256, so a changed file fails loudly)
# Replies are cached by request hash (actions/cache): an unchanged request is never paid twice,
# so a change that does not touch what the model sees costs nothing.
name: extraction-eval

on:
  pull_request:
    paths:
      - "backend/core/extraction/**"
      - "backend/core/gis/inspect_pdf.py"
      - "backend/municipalities/**"
      - "backend/tests/corpus/**"
      - ".github/workflows/extraction-eval.yml"
  push:
    branches: [main]
    paths:
      - "backend/core/extraction/**"
      - "backend/core/gis/inspect_pdf.py"
      - "backend/municipalities/**"
      - "backend/tests/corpus/**"
  workflow_dispatch:

concurrency:
  group: extraction-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: https://api.anthropic.com
      CORPUS_SOURCE_DIR: ${{ github.workspace }}/corpus-source
      EXTRACTION_EVAL_CACHE: ${{ github.workspace }}/.extraction-eval-cache
    steps:
      - uses: actions/checkout@v4

      - name: Secrets present?
        id: secrets
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "${{ secrets.CORPUS_ARCHIVE_URL }}" ]; then
            echo "::warning::ANTHROPIC_API_KEY or CORPUS_ARCHIVE_URL not set: extraction eval skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        if: steps.secrets.outputs.run == 'true'
        run: pip install -e ".[dev,gis,ai]"

      - name: Fetch the corpus documents
        if: steps.secrets.outputs.run == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL "${{ secrets.CORPUS_ARCHIVE_URL }}" -o corpus.zip
          mkdir -p corpus-source && unzip -q corpus.zip -d corpus-source && rm corpus.zip

      - name: Restore the reply cache
        if: steps.secrets.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.extraction-eval-cache
          key: extraction-eval-${{ hashFiles('backend/core/extraction/**', 'backend/tests/corpus/**', 'backend/municipalities/**') }}
          restore-keys: extraction-eval-

      - name: Evaluate and check against the baseline
        if: steps.secrets.outputs.run == 'true'
        run: |
          python -m core.extraction corpus eval --live --concurrency 6 --no-log --check --quiet \
            --note "CI ${{ github.sha }}"
