<style>
:root{
  --ink:#2A2118; --ink-2:#6B6152; --ink-3:#A79E8C; --paper:#F4EFE6; --paper-2:#ECE4D6; --line:#DDD3C3;
  --rule:#DDD3C3;
  --brand:#B5613B; --brand-dark:#8F472A; --brand-tint:rgba(181,97,59,.11);
  --z-res:#B5744A; --z-com:#BE9A44; --z-mix:#8A7A8E; --z-pub:#5E8A82; --z-grn:#7C8A4F;
  --paid:#B08A2E; --paid-dark:#8C6B22; --paid-tint:rgba(176,138,46,.13); --danger:#A24A32; --white:#FBF8F2;
  --shadow: 0 1px 2px rgba(42,33,24,.05), 0 1px 3px rgba(42,33,24,.07);
  --shadow-lg: 0 12px 32px -8px rgba(42,33,24,.20), 0 2px 6px rgba(42,33,24,.07);
  --r:8px; --r-lg:12px;
  --mono:'JetBrains Mono',monospace; --disp:'Schibsted Grotesk',-apple-system,sans-serif; --body:'Schibsted Grotesk',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--brand);color:var(--white)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ---------- top bar ---------- */
.topbar{height:62px;flex:0 0 62px;background:#241B12;color:var(--paper);display:flex;align-items:center;
  gap:20px;padding:0 20px;z-index:60;position:relative;border-bottom:1px solid rgba(244,239,230,.10)}
.brand{display:flex;align-items:center;gap:1px}
.brand .logo{height:36px;display:block}
.searchwrap{flex:1;max-width:560px;position:relative;margin:0 auto}
.searchwrap input{width:100%;height:40px;border-radius:8px;border:1px solid rgba(244,239,230,.18);background:rgba(244,239,230,.06);
  color:var(--paper);padding:0 44px 0 38px;font-size:14px;font-family:var(--body);outline:none;transition:.14s}
.searchwrap input::placeholder{color:rgba(244,239,230,.5)}
.searchwrap input:focus{border-color:var(--brand);background:rgba(244,239,230,.10);box-shadow:0 0 0 3px rgba(181,97,59,.28)}
.searchwrap .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55}
.searchwrap .kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);
  font-size:11px;color:rgba(244,239,230,.5);border:1px solid rgba(244,239,230,.2);border-radius:6px;padding:3px 6px}
.searchsug{position:absolute;top:44px;left:0;right:0;background:var(--white);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;display:none;color:var(--ink);z-index:70}
.searchsug.on{display:block}
.searchsug button{display:flex;width:100%;align-items:center;gap:11px;padding:12px 14px;text-align:left;font-size:14.5px;border-bottom:1px solid var(--paper-2)}
.searchsug button:last-child{border-bottom:none}
.searchsug button:hover{background:var(--brand-tint)}
.searchsug .ico{width:26px;height:26px;border-radius:12px;background:var(--paper-2);display:grid;place-items:center;flex:0 0 26px}
.searchsug .sub{font-family:var(--mono);font-size:12px;color:var(--ink-2);opacity:.7}
.topnav{display:flex;align-items:center;gap:4px}
.topnav button{font-size:14px;color:rgba(244,239,230,.74);padding:8px 13px;border-radius:8px;font-weight:500;display:flex;align-items:center;gap:6px}
.topnav button:hover{background:rgba(244,239,230,.10);color:var(--paper)}
.topnav button.active{background:var(--brand);color:var(--white)}
.pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(176,138,46,.16);color:var(--paid);border:1px solid rgba(176,138,46,.5)}

/* ---------- main split ---------- */
.main{flex:1;display:flex;min-height:0;position:relative}

/* ---------- layer rail ---------- */
.rail{width:206px;flex:0 0 206px;background:var(--white);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:14px 0 20px;gap:4px;overflow-y:auto;z-index:30}
.rail::-webkit-scrollbar{width:0}
.rail .rlabel{align-self:stretch;padding:0 16px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  color:var(--ink-2);opacity:.9;font-weight:600;text-transform:uppercase;margin:6px 0 2px}
.rail .rlabel:first-child{margin-top:0}
.railhead{align-self:stretch;padding:0 16px 8px;margin-bottom:2px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.railhead b{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:-.01em}
.railtog{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto}
.railtog:hover{background:var(--paper);color:var(--ink)}
.rail.collapsed{width:46px;flex:0 0 46px;padding:12px 0 0;align-items:center}
.railopen{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--white)}
.railopen:hover{border-color:var(--brand);color:var(--brand)}
.railhead span{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);opacity:.8}
.lyr{width:182px;min-height:32px;padding:5px 30px 5px 12px;border-radius:10px;display:grid;grid-template-columns:auto 1fr;
  align-items:center;align-content:center;column-gap:11px;row-gap:2px;text-align:left;
  border:1.5px solid transparent;transition:.13s;position:relative}
.lyr:hover .nm{color:var(--brand-dark)}
.lyr.on{background:transparent;border-color:transparent}
.lyr.on::after{content:none}
.lyr .swatch{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;border:1.5px solid rgba(42,33,24,.15);align-self:center}
.lyr .lyrtext{display:flex;flex-direction:column;gap:1px;min-width:0}
.lyr .nm{font-size:14px;line-height:1.3;text-align:left;font-weight:600;color:var(--ink);text-wrap:pretty;letter-spacing:-.005em}
.lyr.on .nm{color:var(--brand-dark);font-weight:600}
.lyr .chk{position:absolute;top:50%;margin-top:-8px;right:9px;width:16px;height:16px;border-radius:50%;background:var(--brand);
  display:none;place-items:center}
.lyr.on .chk{display:grid}
.lyr:not(.on):not(.core):not(.paidlayer)::before{content:'';position:absolute;top:50%;margin-top:-8px;right:9px;
  width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);background:var(--white)}
.lyr:not(.on):hover::before{border-color:var(--brand)}
.lyr.core .lock{display:none}
.lyr.core{cursor:default}
.lyr.core .chk{background:var(--muted,#B3A894);opacity:.55}
.lyr.core .nm{color:var(--ink-2);font-weight:600}
.lyr.core:hover .nm{color:var(--ink-2)}

/* ---------- map ---------- */
.mapwrap{flex:1;position:relative;overflow:hidden;background:#EDE6D6}
#map{width:100%;height:100%;display:block;cursor:grab}
#map:active{cursor:grabbing}
.mapchrome{position:absolute;inset:0;pointer-events:none}
.maptools{position:absolute;right:16px;bottom:88px;z-index:60;display:flex;flex-direction:column;gap:7px;pointer-events:auto}
.mbtn{width:42px;height:42px;background:var(--white);border:1px solid var(--line);border-radius:12px;
  display:grid;place-items:center;box-shadow:var(--shadow);font-family:var(--disp);font-size:17px;font-weight:600}
.mbtn:hover{background:var(--paper)}
.coords{position:absolute;left:16px;bottom:16px;background:rgba(42,33,24,.86);color:var(--paper);
  font-family:var(--mono);font-size:12.5px;padding:7px 11px;border-radius:8px;pointer-events:none;letter-spacing:.02em}
.scalebar{position:absolute;left:16px;bottom:52px;pointer-events:none;display:flex;flex-direction:column;gap:2px}
.scalebar .bar{width:80px;height:5px;border:1.5px solid var(--ink);border-top:none;opacity:.6}
.scalebar .t{font-family:var(--mono);font-size:12px;color:var(--ink);opacity:.7}
.legend{position:absolute;left:16px;top:16px;background:var(--white);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:14px 17px;pointer-events:auto;max-width:264px;transition:.2s;
  max-height:calc(100% - 92px);overflow-y:auto;overflow-x:hidden}
.legend h4{font-family:var(--disp);font-size:16px;letter-spacing:.01em;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.legend h4 button{font-size:14px;opacity:.5;line-height:1}
.legrow{display:flex;align-items:center;gap:10px;font-size:13.5px;line-height:1.4;margin:7px 0;color:var(--ink-2)}
.legrow .sw{width:14px;height:14px;border-radius:12px;border:1px solid rgba(42,33,24,.2);flex:0 0 14px}
.legrow .sw.line{border:none;background:none;height:0;border-top:3px dashed var(--lc);border-radius:2px;flex:0 0 16px;width:16px;align-self:center}
.legend.min .legbody{display:none}
.legend.min{max-width:none;width:auto}
.legend.min h4{margin-bottom:0;gap:14px}
.coverwarn{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  font-size:13.5px;padding:9px 18px;border-radius:999px;pointer-events:auto;display:none;align-items:center;gap:9px;box-shadow:var(--shadow-lg)}
.coverwarn.on{display:flex}
.coverwarn .mono{font-size:12px;opacity:.7}

/* parcel svg styling */
.zone{pointer-events:none;transition:filter .15s, opacity .15s}
.zoneline{fill:none;stroke-width:1;stroke-opacity:.4;pointer-events:none}
.blockline{fill:none;stroke:#B3A894;stroke-width:1;stroke-dasharray:3 2.5;stroke-opacity:.45;pointer-events:none}
.docarea{cursor:pointer;fill:transparent;stroke:#B3A894;stroke-width:2.8;stroke-dasharray:10 5;stroke-opacity:.5;transition:.15s}
.docarea:hover{stroke-opacity:1;stroke:var(--brand-dark);fill:rgba(181,97,59,.06)}
.docarea.sel{stroke:var(--brand);stroke-opacity:1;stroke-width:3.4;stroke-dasharray:none;fill:rgba(181,97,59,.07)}
.uparcel{cursor:pointer;fill:transparent;stroke:var(--brand-dark);stroke-width:1.6;stroke-dasharray:4 3;transition:.13s}
.uparcel:hover{stroke-width:2.6;stroke-dasharray:none;fill:rgba(181,97,59,.14)}
.uparcel.sel{stroke:var(--brand);stroke-width:2.8;stroke-dasharray:none;fill:rgba(181,97,59,.22);filter:drop-shadow(0 2px 6px rgba(181,97,59,.4))}
.parcel{cursor:pointer;transition:.13s;stroke:rgba(42,33,24,.20);stroke-width:.6}
.parcel:hover{stroke:var(--ink);stroke-width:1.2}
.parcel.sel{stroke:var(--brand);stroke-width:2.2;filter:drop-shadow(0 2px 6px rgba(181,97,59,.4))}
.planned-outline{fill:none;stroke:var(--brand-dark);stroke-width:1.6;stroke-dasharray:4 3}
.road{stroke:#FFFFFF;fill:none;stroke-linecap:round}
.road.major{stroke:#FFFFFF;stroke-width:9}
.road.minor{stroke:#F2EBDC;stroke-width:4.5}
.river{fill:#BCCEC8;opacity:.85}
.riverline{stroke:#A4B9B2;fill:none;stroke-width:1}
.blocklabel{font-family:var(--mono);font-size:5.5px;fill:rgba(42,33,24,.5);pointer-events:none;font-weight:700}
.pin{pointer-events:none;transition:.2s}
.mapwrap.drag{cursor:grabbing}
.mapwrap.drag #map{cursor:grabbing}
.zlabel{font-family:var(--mono);font-size:12px;font-weight:600;height:26px;color:var(--ink-2)}
/* layer dependency */
.lyr.dep{opacity:.6}
.lyr .depwarn{position:absolute;top:7px;left:6px;font-size:11px;line-height:1;color:var(--paid)}
.depnote{width:182px;margin:3px 0 6px;font-size:12px;line-height:1.4;text-align:left;color:var(--brand-dark);
  background:var(--brand-tint);border:1px solid rgba(181,97,59,.3);border-radius:8px;padding:7px 10px;cursor:pointer}
.depnote:hover{background:rgba(181,97,59,.16)}
.depnote b{display:block;font-weight:700;text-decoration:underline}
.depnote.paid{color:var(--paid);background:var(--paid-tint);border-color:rgba(176,138,46,.3)}
.depnote.paid:hover{background:rgba(176,138,46,.16)}
.lyr.paidlayer{opacity:1;background:transparent;border-color:transparent}
.lyr.paidlayer:hover{background:transparent}
.lyr.paidlayer .swatch{filter:grayscale(.35);opacity:.85}
.lyr .paidlock{position:absolute;top:50%;transform:translateY(-50%);right:9px;width:19px;height:19px;border-radius:50%;
  background:var(--paid);color:#fff;display:inline-flex;align-items:center;justify-content:center;line-height:0}
.lyr .subnm.lockedsub{grid-column:2;color:var(--paid);font-weight:600;opacity:1;font-family:var(--body);letter-spacing:0;
  display:inline-flex;align-items:center;gap:4px}
.lyr .subnm{grid-column:2;font-size:12px;line-height:1.3;text-align:left;color:var(--ink-2);opacity:.9;font-family:var(--mono)}
.lyr.on .subnm{color:var(--brand-dark);opacity:.85}
/* grouped legend */
.leggrp+.leggrp{margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.legh{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);
  opacity:.7;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;gap:6px}
.legu{letter-spacing:.02em;text-transform:none;opacity:.85}
#homePill{cursor:pointer;transition:.14s;background:rgba(176,138,46,.16);color:var(--paid);border:1px solid rgba(176,138,46,.5)}
#homePill:hover{background:rgba(176,138,46,.30)}
/* cadastral → urban parcel link */
.backlink{margin:10px 20px -4px;font-size:13.5px;color:var(--brand-dark);cursor:pointer;font-weight:600}
.backlink:hover{text-decoration:underline}
.upcard{background:var(--paid-tint);border:1px solid rgba(176,138,46,.3);border-radius:12px;padding:13px 14px;cursor:pointer;transition:.14s}
.upcard:hover{border-color:var(--paid);box-shadow:var(--shadow)}
.upcard.none{background:var(--paper);border-color:var(--line);cursor:default}
.upcard .upn{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--paid);letter-spacing:.01em}
.upcard.none .upn{color:var(--ink-2);font-size:14px}
.upcard .upd{font-size:13.5px;line-height:1.55;color:var(--ink-2);margin-top:5px}
.upcard .upd b{color:var(--paid)}
.upcard .upgo{margin-top:11px;font-size:13.5px;font-weight:600;color:var(--paid);display:flex;align-items:center;gap:6px}
.upcard:hover .upgo span{transform:translateX(3px)}
.upcard .upgo span{display:inline-block;transition:.14s}

/* heat overlay */
.heatcell{pointer-events:none;mix-blend-mode:multiply}

/* ---------- info panel ---------- */
.panel{width:392px;flex:0 0 392px;background:var(--white);border-left:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;box-shadow:-8px 0 24px rgba(42,33,24,.05)}
.panel.hidden{display:none}
.pscroll{flex:1;overflow-y:auto;overflow-x:hidden}
.pscroll::-webkit-scrollbar{width:8px}
.pscroll::-webkit-scrollbar-thumb{background:var(--paper-2);border-radius:12px}
.pscroll::-webkit-scrollbar-thumb:hover{background:var(--line)}

/* empty state */
.pempty{padding:40px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;height:100%;justify-content:center}
.pempty .ill{width:96px;height:96px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center}
.pempty .ill img{width:60px;height:60px;display:block}
.pempty h3{font-family:var(--disp);font-size:23px;font-weight:600;letter-spacing:-.01em}
.pempty p{font-size:15px;color:var(--ink-2);line-height:1.6;max-width:290px}
.pempty .hintrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.pempty .pinnote{display:flex;align-items:center;gap:9px;text-align:left;font-size:13px;line-height:1.45;
  color:var(--ink);background:rgba(181,97,59,.08);border:1px solid rgba(181,97,59,.25);border-radius:8px;
  padding:10px 13px;max-width:290px}
.pempty .pinnote svg{flex:0 0 auto}
.pempty .pinnote b{font-family:var(--mono);font-weight:600;white-space:nowrap}
.pempty .pinnote b{font-family:var(--mono);font-weight:600}
.chiphint{font-size:13px;font-family:var(--mono);background:var(--paper);border:1px solid var(--line);
  padding:5px 11px;border-radius:999px;color:var(--ink-2)}

/* panel header */
.phead{padding:16px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--white);z-index:5}
.peyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:700;display:flex;align-items:center;gap:7px}
.peyebrow .tag{background:var(--brand-tint);padding:2px 9px;border-radius:999px}
.ptitle{font-family:var(--disp);font-size:25px;font-weight:600;letter-spacing:-.015em;margin-top:7px;line-height:1.15}
.psub{font-size:13px;color:var(--ink-2);margin-top:5px;font-family:var(--mono)}
.pclose{position:absolute;top:15px;right:16px;width:28px;height:28px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.pclose:hover{background:var(--paper)}

/* id grid */
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 20px 4px}
.idcell{background:var(--white);padding:10px 13px}
.idcell .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);opacity:.75;font-weight:600}
.idcell .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:2px;word-break:break-word}
.idcell.full{grid-column:1/3}

/* section */
.sect{padding:16px 20px}
.sect+.sect{border-top:1px solid var(--line)}
.secthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.secthead .lbl{font-family:var(--disp);font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.badge{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.badge.free{background:var(--brand-tint);color:var(--brand-dark)}
.badge.paid{background:var(--paid-tint);color:var(--paid)}
.badge{display:inline-flex;align-items:center;gap:4px}

/* param rows */
.prow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--paper-2);gap:12px}
.prow:last-child{border-bottom:none}
.prow .pk{font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.prow .pv{font-family:var(--mono);font-size:14.5px;font-weight:700;text-align:right;white-space:nowrap}
.prow .pv .u{font-weight:400;font-size:12px;opacity:.65;margin-left:2px}
.srcref{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;color:var(--brand);
  background:var(--brand-tint);padding:1px 7px;border-radius:999px;margin-left:6px;cursor:pointer;vertical-align:middle}
.srcref:hover{background:var(--brand);color:var(--white)}

/* existing vs planned callout */
.vscard{margin:0 0 4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}
.vsmini{width:66px;height:52px;flex:0 0 66px;position:relative}
.vscard .txt{font-size:13px;color:var(--ink-2);line-height:1.5}
.vscard .txt b{color:var(--ink);font-family:var(--mono);font-size:13.5px}
.vsdelta{font-family:var(--mono);font-weight:700;color:var(--paid)}

/* locked / paywall */
.locked{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--paid);margin-top:4px}
.locked .blurred{filter:blur(5px);opacity:.55;pointer-events:none;padding:4px 2px;user-select:none}
.lockover{position:absolute;inset:0;background:rgba(243,241,241,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:9px}
.lockover .lk{width:38px;height:38px;border-radius:12px;background:var(--paid);color:var(--white);display:grid;place-items:center}
.lockover h4{font-family:var(--disp);font-size:17px;font-weight:600}
.lockover p{font-size:13px;color:var(--ink-2);max-width:250px;line-height:1.5}
.lockover .b{font-family:var(--mono);font-size:12.5px;padding:9px 16px;border-radius:12px;background:var(--paid);color:var(--white);font-weight:700}
.lockover .b:hover{background:#6D28D9}

/* locked parameter list — names readable, values redacted */
.lockedlist{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--white)}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px}
.lrow+.lrow{border-top:1px solid var(--paper-2)}
.lk2{font-size:14.5px;color:var(--ink);font-weight:500;display:flex;flex-direction:column;gap:1px}
.lk2 .ld{font-size:12.5px;color:var(--ink-2);opacity:.85;font-weight:400}
.lv{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.lockval{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  background:var(--paid-tint);border:1px solid rgba(176,138,46,.3);color:var(--paid);
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em}
.lockval svg{flex:0 0 auto}
.lu{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);opacity:.8;width:16px}
.lockcta{margin-top:11px;display:flex;align-items:center;gap:11px;padding:11px 13px;
  background:var(--paid-tint);border:1px solid rgba(176,138,46,.3);border-radius:12px}
.lockcta .lki{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--paid);color:var(--white);display:grid;place-items:center}
.lockcta .lct{flex:1;display:flex;flex-direction:column;gap:1px}
.lockcta .lct b{font-size:15px;color:var(--ink)}
.lockcta .lct span{font-size:13px;color:var(--ink-2);line-height:1.45}
.lockcta .b{font-family:var(--mono);font-size:12.5px;padding:9px 14px;border-radius:10px;background:var(--paid);color:var(--white);font-weight:700;white-space:nowrap}
.lockcta .b:hover{background:#6D28D9}

/* calculation-engine provenance strip */
.enginestrip{margin-top:11px;display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;transition:.14s}
.enginestrip:hover{border-color:var(--brand);background:var(--brand-tint)}
.enginestrip .ei{color:var(--brand);line-height:0;flex:0 0 auto}
.enginestrip .et{flex:1;font-size:13px;color:var(--ink-2);line-height:1.4}
.enginestrip .ea{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--brand-dark)}

/* engine modal tables */
.ftable,.itable{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.frow2{display:grid;grid-template-columns:1.05fr 1.35fr .6fr;gap:12px;padding:9px 13px;align-items:baseline}
.frow2+.frow2,.irow+.irow{border-top:1px solid var(--paper-2)}
.frow2 .fn{font-size:12.5px;font-weight:600;color:var(--ink)}
.frow2 .ff{font-size:11.5px;color:var(--brand-dark)}
.frow2 .fs{font-size:10.5px;color:var(--ink-2);opacity:.85;text-align:right}
.irow{display:grid;grid-template-columns:.8fr 1.6fr;gap:12px;padding:9px 13px;align-items:baseline}
.irow .in2{font-size:12.5px;font-weight:600;color:var(--ink)}
.irow .id2{font-size:11.5px;color:var(--ink-2);line-height:1.45}
.growbox{margin-top:16px;padding:13px 15px;background:var(--brand-tint);border:1px solid rgba(181,97,59,.3);
  border-radius:12px;font-size:12px;line-height:1.55;color:var(--ink-2)}
.growbox b{display:block;color:var(--brand-dark);font-size:12.5px;margin-bottom:3px}
.fnote{font-family:var(--mono);font-size:12px;color:var(--ink-2);opacity:.8}

/* order form: summary, segmented type, methodology link */
.ordersum{border:1px solid rgba(176,138,46,.3);background:var(--paid-tint);border-radius:12px;overflow:hidden;margin-bottom:9px}
.osrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;font-size:14px;color:var(--ink)}
.osrow+.osrow{border-top:1px solid rgba(176,138,46,.18)}
.osl{display:flex;flex-direction:column;gap:1px;min-width:0}
.osrow em{font-style:normal;font-size:12px;color:var(--ink-2);opacity:.85}
.osrow .mono{font-weight:700;color:var(--paid);white-space:nowrap}
.osrow.deliv{background:rgba(255,255,255,.5)}
.osrow.deliv .mono{color:var(--brand-dark)}
.pricenote{font-size:12px;color:var(--ink-2);line-height:1.5;opacity:.9;margin-bottom:16px}
.fieldlab{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px;background:var(--paper)}
.segb{flex:1;padding:11px 12px;font-size:14px;font-weight:500;color:var(--ink-2);transition:.13s}
.segb+.segb{border-left:1px solid var(--line)}
.segb:hover{background:var(--paper-2)}
.segb.on{background:var(--brand);color:var(--white);font-weight:600}
.methlink{margin-top:14px;display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;
  border:1px solid var(--line);border-radius:12px;background:var(--white);transition:.14s}
.methlink:hover{border-color:var(--brand);background:var(--brand-tint)}
.methlink .mli{color:var(--brand);line-height:0;flex:0 0 auto}
.methlink .mlt{flex:1;display:flex;flex-direction:column;gap:1px}
.methlink .mlt b{font-size:15px;color:var(--ink)}
.methlink .mlt span{font-size:13px;color:var(--ink-2);line-height:1.45}
.methlink .mla{font-family:var(--mono);font-weight:700;color:var(--brand-dark);transition:.14s}
.methlink:hover .mla{transform:translateX(3px)}
.mfoot .fnote{margin-right:auto}

/* AI training provenance */
.aitrain{display:flex;gap:8px;align-items:flex-start;padding:11px 14px;margin:0 0 2px;
  background:var(--paper);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.45}
.aitrain b{color:var(--brand-dark)}

/* ROI hero */
.roihero{margin:4px 20px 0;background:var(--ink);color:var(--paper);
  border-radius:16px;padding:15px 17px;position:relative;overflow:hidden}
.roihero .rlab{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.roihero .rval{font-family:var(--disp);font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:5px}
.roihero .rrange{font-family:var(--mono);font-size:12.5px;opacity:.85;margin-top:7px}
.roihero .spark{position:absolute;right:0;bottom:0;opacity:.25}

/* range bars */
.rangebar{height:6px;border-radius:12px;background:var(--paper-2);position:relative;margin-top:6px;overflow:hidden}
.rangebar .fill{position:absolute;top:0;bottom:0;background:var(--brand);border-radius:12px;opacity:.35}
.rangebar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--brand-dark)}

/* CTA */
.ctastack{padding:16px 20px;display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line);background:var(--paper)}
.cta{width:100%;height:50px;border-radius:12px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:0 16px;transition:.14s;font-family:var(--body)}
.cta.primary{background:var(--brand);color:var(--white)}
.cta.primary:hover{background:var(--brand-dark)}
.cta.gold{background:var(--paid);color:var(--white)}
.cta.gold:hover{background:#6D28D9}
.cta.ghost{background:var(--white);border:1px solid var(--line);color:var(--ink)}
.cta.ghost:hover{border-color:var(--ink);background:var(--white)}
.cta small{font-weight:400;opacity:.8;font-family:var(--mono);font-size:12.5px;margin-left:auto}

/* assumptions editor */
.assum{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.assum .ah{font-size:13.5px;font-family:var(--disp);font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.arow label{font-size:13px;color:var(--ink-2);flex:1}
.arow input[type=range]{flex:1.4;accent-color:var(--brand);height:4px}
.arow .av{font-family:var(--mono);font-size:12.5px;font-weight:700;width:70px;text-align:right}

/* zone docs list */
.doclist{display:flex;flex-direction:column;gap:7px}
.docitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--white)}
.docitem:hover{border-color:var(--brand);background:var(--brand-tint)}
.docitem .di{width:30px;height:30px;border-radius:12px;background:var(--paper-2);display:grid;place-items:center;flex:0 0 30px;color:var(--ink-2)}
.docitem .dn{flex:1;font-size:14.5px;font-weight:500;line-height:1.4}
.docitem .dn .dm{display:block;font-family:var(--mono);font-size:12px;color:var(--ink-2);opacity:.7;margin-top:1px}
.dstat{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase}
.dstat.adopted{background:var(--brand-tint);color:var(--brand-dark)}
.dstat.progress{background:var(--paid-tint);color:var(--paid)}

/* ---------- AI assistant ---------- */
.aifab{position:absolute;right:412px;bottom:20px;z-index:50;width:52px;height:52px;border-radius:12px;
  background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:var(--shadow-lg);transition:.16s}
.aifab:hover{transform:translateY(-2px)}
.aifab .badge2{position:absolute;top:-5px;right:-5px;background:var(--brand);color:var(--white);font-family:var(--mono);
  font-size:9px;font-weight:700;padding:2px 5px;border-radius:12px}
.aipanel{position:absolute;right:412px;bottom:20px;z-index:55;width:380px;height:544px;background:var(--white);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden}
.aipanel.on{display:flex}
.main:has(.aipanel.on) .maptools{visibility:hidden}
.aihead{padding:13px 15px;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:10px}
.aihead .av{width:30px;height:30px;border-radius:12px;background:var(--brand);display:grid;place-items:center}
.aihead .t{flex:1}
.aihead .t h4{font-family:var(--disp);font-size:16px;font-weight:600}
.aihead .t p{font-size:12px;opacity:.75;font-family:var(--mono)}
.aihead button{color:var(--paper);opacity:.7}.aihead button:hover{opacity:1}
.aiquota{padding:9px 15px;background:var(--brand-tint);font-size:12.5px;color:var(--brand-dark);display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
.aiquota .dots{display:flex;gap:3px;margin-left:auto}
.aiquota .qd{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.aiquota .qd.used{background:var(--line)}
.aibody{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.msg{display:flex;gap:9px;max-width:88%}
.msg .b{padding:11px 13px;border-radius:12px;font-size:14px;line-height:1.55}
.msg.bot .b{background:var(--white);border:1px solid var(--line);border-top-left-radius:0}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.user .b{background:var(--brand);color:var(--white);border-top-right-radius:0}
.msg .b .cite{display:block;margin-top:7px;font-family:var(--mono);font-size:11.5px;color:var(--brand);cursor:pointer}
.msg.user .b .cite{color:rgba(255,255,255,.8)}
.aifoot{padding:11px 13px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--white)}
.aifoot input{flex:1;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 13px;font-size:14px;font-family:var(--body);outline:none}
.aifoot input:focus{border-color:var(--brand)}
.aifoot .send{width:38px;height:38px;border-radius:12px;background:var(--brand);color:var(--white);display:grid;place-items:center;flex:0 0 38px}
.aifoot .send:hover{background:var(--brand-dark)}
.aichips{display:flex;gap:6px;padding:0 13px 11px;flex-wrap:wrap;background:var(--white)}
.aichip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--ink-2)}
.aichip:hover{border-color:var(--brand);color:var(--brand)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,17,14,.55);z-index:100;display:none;
  align-items:center;justify-content:center;padding:24px}
.overlay.on{display:flex}
.modal{background:var(--white);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;
  max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:pop .2s ease}
.modal.wide{max-width:860px}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.mhead{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
.mhead .mi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 42px}
.mhead .mt{flex:1}
.mhead .meyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.mhead h2{font-family:var(--disp);font-size:23px;font-weight:600;letter-spacing:-.015em;margin-top:4px}
.mhead p{font-size:14px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.mhead .x{width:30px;height:30px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.mhead .x:hover{background:var(--paper)}
.mbody{padding:20px 24px;overflow-y:auto}
.mfoot{padding:16px 24px;border-top:1px solid var(--line);background:var(--paper);display:flex;gap:10px;justify-content:flex-end}

/* form */
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px}
.field label .opt{font-weight:400;color:var(--ink-2);font-family:var(--mono);font-size:11.5px}
.field input,.field select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 13px;font-size:14.5px;font-family:var(--body);outline:none;background:var(--white)}
.field input:focus,.field select:focus{border-color:var(--brand)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctx{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.ctx .ci{width:32px;height:32px;border-radius:12px;background:var(--brand-tint);display:grid;place-items:center;color:var(--brand);flex:0 0 32px}
.ctx .cd{font-size:13px;color:var(--ink-2)}
.ctx .cd b{color:var(--ink);font-family:var(--mono);font-size:13.5px}

/* plan cards */
.plans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.plan{border:1.5px solid var(--line);border-radius:12px;padding:16px 15px;position:relative;transition:.15s;cursor:pointer;display:flex;flex-direction:column}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:6px;flex:1}
.plan .cta{margin-top:12px}
.plan:hover{border-color:var(--brand)}
.plan.feat{border-color:var(--paid);background:var(--white)}
.plan .ptag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--paid);color:var(--white);
  font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 9px;border-radius:12px;text-transform:uppercase}
.plan h3{font-family:var(--disp);font-size:17px;font-weight:600}
.plan .pr{font-family:var(--disp);font-size:30px;font-weight:700;margin:6px 0 2px;letter-spacing:-.02em}
.plan .pr small{font-size:12.5px;font-weight:400;color:var(--ink-2);font-family:var(--mono)}
.plan .pd{font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-bottom:12px;min-height:46px}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.plan li{font-size:13px;display:flex;gap:7px;align-items:flex-start;color:var(--ink-2)}
.plan li svg{flex:0 0 14px;margin-top:1px;color:var(--brand)}

/* pay */
.payline{gap:16px}
.payline .mono{white-space:nowrap}
.paysummary{background:var(--paper);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.payline{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--ink-2)}
.payline.total{border-top:1px solid var(--line);margin-top:7px;padding-top:10px;font-weight:700;color:var(--ink);font-size:17px}
.payline.total .mono{font-family:var(--mono)}
.paycard{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;align-items:center;gap:11px;margin-bottom:10px}
.paycard .brandmark{font-family:var(--mono);font-weight:700;font-size:14.5px;color:var(--brand-dark)}
.securenote{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);font-family:var(--mono);justify-content:center;margin-top:4px}

/* success */
.success{text-align:center;padding:14px 10px}
.success .ok{width:64px;height:64px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px;animation:pop .3s ease}
.success h2{font-family:var(--disp);font-size:25px;font-weight:600}
.success p{font-size:14.5px;color:var(--ink-2);margin-top:9px;line-height:1.55;max-width:360px;margin-inline:auto}
.orderref{font-family:var(--mono);font-size:14.5px;font-weight:700;background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:9px 14px;display:inline-block;margin-top:14px}

/* ---------- admin ---------- */
.admin{position:absolute;inset:0;background:var(--paper);z-index:45;display:none;flex-direction:column}
.admin.on{display:flex}
.main:has(.admin.on) .mapchrome,.main:has(.admin.on) .aifab,.main:has(.admin.on) .aipanel{display:none}
.adminbar{height:60px;flex:0 0 60px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:18px;overflow-x:auto}
.adminbar .at,.adminbar .abtn,.admintabs button{white-space:nowrap}
.adminbar .at{font-family:var(--disp);font-weight:600;font-size:17px;display:flex;align-items:center;gap:9px}
.admintabs{display:flex;gap:3px;margin-left:10px}
.admintabs button{font-size:13.5px;padding:8px 13px;border-radius:12px;color:var(--ink-2);font-weight:500}
.admintabs button.active{background:var(--brand-tint);color:var(--brand-dark);font-weight:600}
.admintabs button:hover:not(.active){background:var(--paper)}
.adminbody{flex:1;overflow-y:auto;padding:24px 28px}
.adminview{display:none}.adminview.on{display:block}
.astat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.astat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.astat .sl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.astat .sv{font-family:var(--disp);font-size:32px;font-weight:700;margin-top:5px;letter-spacing:-.02em}
.astat .sv small{font-size:13.5px;color:var(--ink-2);font-weight:400}
.astat .sd{font-family:var(--mono);font-size:11.5px;margin-top:4px}
.astat .up{color:var(--brand)}.astat .warn{color:var(--paid)}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.cardhd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.cardhd h3{font-family:var(--disp);font-size:16.5px;font-weight:600}
.cardhd .sub{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;padding:11px 18px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--paper);font-weight:700}
.tbl td{padding:11px 18px;border-top:1px solid var(--paper-2)}
.tbl tr:hover td{background:var(--brand-tint)}
.tbl .mono{font-size:13px}
.st{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase}
.st.ok{background:var(--brand-tint);color:var(--brand-dark)}
.st.pend{background:var(--paid-tint);color:var(--paid)}
.st.rev{background:#e7ecf3;color:#3a5a8a}
.abtn{font-size:13px;font-weight:600;padding:7px 13px;border-radius:12px;background:var(--brand);color:var(--white)}
.abtn:hover{background:var(--brand-dark)}
.abtn.sm{padding:5px 11px;font-size:12.5px}
.abtn.ghost{background:var(--white);border:1px solid var(--line);color:var(--ink-2)}
.abtn.ghost:hover{border-color:var(--ink);color:var(--ink)}
.review-item{padding:14px 18px;border-top:1px solid var(--paper-2);display:flex;gap:14px;align-items:center}
.review-item .rv{flex:1}
.review-item .rq{font-size:14.5px;font-weight:600}
.review-item .rsrc{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:3px}
.review-item .rextract{font-family:var(--mono);font-size:14.5px;font-weight:700;color:var(--brand-dark);background:var(--brand-tint);padding:5px 11px;border-radius:12px}
.review-acts{display:flex;gap:6px}

/* phase footer strip */
.phasestrip{position:absolute;left:206px;right:392px;bottom:0;height:0;overflow:visible;pointer-events:none}

/* methodology wizard */
.cta.line{background:var(--white);border:1px solid var(--line);color:var(--ink-2)}
.cta.line:hover{border-color:var(--brand);color:var(--brand)}
.method{display:grid;grid-template-columns:272px 1fr;min-height:432px}
.mrail{border-right:1px solid var(--line);background:var(--paper);padding:18px 0}
.mrail-h{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding:0 22px 12px}
.mstep{display:flex;gap:12px;align-items:flex-start;padding:11px 22px;cursor:pointer;position:relative;transition:.14s}
.mstep:hover{background:var(--paper-2)}
.mstep.on{background:var(--white)}
.mstep.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.mstep .mn{flex:0 0 24px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--white);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-2);transition:.14s}
.mstep.on .mn{background:var(--brand);border-color:var(--brand);color:var(--white)}
.mstep.done .mn{background:var(--brand-tint);border-color:var(--brand-tint);color:var(--brand-dark)}
.mstep .ml{font-size:14.5px;line-height:1.4;padding-top:2px}
.mstep .ml b{display:block;font-weight:600;color:var(--ink)}
.mstep .ml span{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-2)}
.mstep.on .ml b{color:var(--brand-dark)}
.mpane{padding:28px 30px;display:flex;flex-direction:column}
.mpane .peyebrow2{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.mpane h2{font-family:var(--disp);font-weight:600;font-size:27px;line-height:1.15;margin:7px 0 4px;color:var(--ink)}
.mpane .phase{font-size:13px;color:var(--ink-2);margin-bottom:18px}
.mdiagram{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:20px;display:flex;align-items:center;justify-content:center;min-height:150px;margin-bottom:16px}
.mbodytext{font-size:15.5px;line-height:1.65;color:var(--ink);white-space:pre-line}
.mbodytext .sub{display:block;font-size:14.5px;line-height:1.6;color:var(--ink-2);padding:5px 0 5px 20px;position:relative}
.mbodytext .sub::before{content:attr(data-k);position:absolute;left:0;font-family:var(--mono);font-weight:600;color:var(--brand);font-size:12px}
.mnav{margin-top:auto;padding-top:20px;display:flex;align-items:center;gap:12px}
.mnav .mcount{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.mprog{flex:1;height:3px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.mprog i{display:block;height:100%;background:var(--brand);transition:width .3s}
@media(max-width:760px){.method{grid-template-columns:1fr}.mrail{display:none}}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--paper);
  padding:13px 22px;border-radius:12px;font-size:14.5px;box-shadow:var(--shadow-lg);z-index:200;transition:.3s;display:flex;align-items:center;gap:10px;opacity:0}
.toast.on{transform:translateX(-50%);opacity:1}
.toast .ti{color:var(--brand)}

/* responsive */
@media(max-width:1100px){
  .panel{width:360px;flex-basis:360px}.aifab,.aipanel{right:380px}
  .rail{width:182px;flex-basis:182px}.lyr,.depnote{width:158px}
}
@media(max-width:860px){
  .rail{display:none}.panel{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:400px}
  .aifab,.aipanel{right:16px;bottom:16px}.searchwrap{max-width:none}
  .plans{grid-template-columns:1fr}.legend{display:none}
}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ============================================================
   LUXE PASS — editorial register: Instrument Serif display,
   hairline rules, 2px geometry, brass accent, caps tracking
   ============================================================ */
/* geometry: sharpen everything, then restore pills & circles */
[class][class][class],input,select,textarea,button,
.searchwrap input,.field input,.field select,.aifoot input,.arow input,.topnav button,.admintabs button,.plan ul li{border-radius:8px}
.pill[class][class],.badge[class][class],.chiphint[class][class],.aichip[class][class],.srcref[class][class],
.coverwarn[class][class],.plan .ptag[class][class],.rangebar[class][class],.rangebar .fill[class][class],
.orderref[class][class]{border-radius:999px}
.chk[class][class],.aiquota .qd[class][class],.success .ok[class][class],.mstep .mn[class][class],
.pempty .ill[class][class]{border-radius:50%}

/* serif display: Instrument Serif has one weight — never synthesise bold */
.brand,.mbtn,.legend h4,.pempty h3,.ptitle,.secthead .lbl,.roihero .rval,.assum .ah,.mhead h2,
.plan h3,.plan .pr,.success h2,.adminbar .at,.cardhd h3,.astat .sv,.mpane h2,.upcard .upn,.aihead .t h4{
  font-weight:700;letter-spacing:-.02em}
.brand{font-size:23px}.legend h4{font-size:19px}.pempty h3{font-size:29px;line-height:1.15}
.ptitle{font-size:31px;line-height:1.1}.secthead .lbl{font-size:20px}.roihero .rval{font-size:48px}
.mhead h2{font-size:28px}.plan h3{font-size:20px}.plan .pr{font-size:35px}.success h2{font-size:31px}
.adminbar .at{font-size:21px}.cardhd h3{font-size:20px}.astat .sv{font-size:39px}.mpane h2{font-size:33px}
.assum .ah{font-size:16px}.aihead .t h4{font-size:18px}


/* uppercase micro-labels: editorial tracking */
.rail .rlabel,.legh,.peyebrow,.mhead .meyebrow,.mpane .peyebrow2,.mrail-h,.tbl th,.fieldlab,.idcell .k,
.roihero .rlab,.pill,.badge,.dstat,.st{letter-spacing:.16em}
.pill{padding:5px 12px;font-weight:500}
.badge{font-weight:500;padding:4px 11px}
.idcell .k,.fieldlab{font-family:var(--mono);font-weight:400;opacity:.9;letter-spacing:.08em}
.tbl th{letter-spacing:.1em}
.adminbar::-webkit-scrollbar{height:0}

/* status: italic serif phrase with a single dot, not a coloured chip */
.dstat,.st{background:none;padding:0;font-family:var(--body);font-weight:600;font-style:normal;
  font-size:13px;letter-spacing:0;text-transform:none;display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.dstat::before,.st::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 5px}
.dstat.adopted,.st.ok{color:var(--brand-dark)}
.dstat.progress,.st.pend{color:var(--paid)}

<script>
/* ============================================================
   UrbanView — interactive mockup
   Vanilla JS. Builds a stylised Podgorica cadastre, an info
   panel with the free/paid boundary, an AI assistant, order +
   payment + subscription flows, and an admin console.
   All data is illustrative.
   ============================================================ */
'use strict';

const fmt = n => n.toLocaleString('en-US');
const eur = n => '€' + fmt(Math.round(n));
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const $ = s => document.querySelector(s);

/* ---------- zone palette ---------- */
const ZTYPES = {
  res: { name: 'Residential', col: 'var(--z-res)', hex: '#B5744A' },
  com: { name: 'Commercial',  col: 'var(--z-com)', hex: '#BE9A44' },
  mix: { name: 'Mixed use',   col: 'var(--z-mix)', hex: '#8A7A8E' },
  pub: { name: 'Public / institutional', col: 'var(--z-pub)', hex: '#5E8A82' },
  grn: { name: 'Green / recreation', col: 'var(--z-grn)', hex: '#7C8A4F' }
};

/* ---------- layers (selected by visual card, per client) ---------- */
const LAYERS = [
  { id: 'docareas',name: 'Planning documents', grp: 'base', on: true,  core: true, sw: 'docdash' },
  { id: 'base',    name: 'Base map',       grp: 'base', on: true,  core: true, sw: '#c4bdac' },
  { id: 'zones',   name: 'Urban zones', grp: 'base', on: true,  core: true, sw: 'zones' },
  { id: 'cadastre',name: 'Cadastral parcels', grp: 'parcels', on: true, sw: '#B3A894' },
  { id: 'planned', name: 'Urban parcels',  grp: 'parcels', on: true, sw: 'dash' },
  { id: 'owner',   name: 'Public ownership', grp: 'parcels', on: false, sw: '#4F6D82', req: 'cadastre' },
  { id: 'restit',  name: 'Restitution / legal', grp: 'parcels', on: false, sw: '#9E5568', req: 'cadastre' },
  { id: 'landuse', name: 'Land use',       grp: 'context', on: false, sw: '#b98a5a' },
  { id: 'heatFAR', name: 'FAR heatmap',    grp: 'context', on: false, sw: 'heat1' },
  { id: 'traffic', name: 'Planned traffic',grp: 'context', on: false, sw: '#5b5b5b' },
  { id: 'heatMkt', name: 'Price heatmap',  grp: 'feas', on: false, sw: 'heat2', paid: true }
];

/* price heatmap shows banded €/m² ranges (subscription layer) */
const PRICE_BANDS = [
  { lo:0,    hi:0,    col:'rgba(150,145,132,.34)', label:'not saleable' },
  { lo:1,    hi:1300, col:'rgba(201,154,46,.26)',  label:'under €1,300' },
  { lo:1300, hi:1700, col:'rgba(201,154,46,.45)',  label:'€1,300 – 1,700' },
  { lo:1700, hi:2100, col:'rgba(201,154,46,.62)',  label:'€1,700 – 2,100' },
  { lo:2100, hi:99999,col:'rgba(201,154,46,.82)',  label:'€2,100 and above' }
];
const priceBand = v => PRICE_BANDS.find(b=>v>=b.lo&&v<=b.hi) || PRICE_BANDS[0];

/* ---------- planning documents (a zone groups several) ---------- */
const DOCS = {
  A: [ { n: 'DUP Podgorica – Blok VII', s: 'adopted' }, { n: 'DUP Stari Aerodrom', s: 'adopted' }, { n: 'Izmjene i dopune DUP-a 2023', s: 'progress' } ],
  B: [ { n: 'DUP Centar – Zona C2', s: 'adopted' }, { n: 'PUP Glavni grad (izvod)', s: 'adopted' } ],
  C: [ { n: 'DUP Konik – Sjever', s: 'adopted' }, { n: 'DUP Konik – Jug', s: 'progress' } ],
  D: [ { n: 'DUP Gorica park', s: 'adopted' } ],
  E: [ { n: 'DUP Zabjelo 3', s: 'adopted' }, { n: 'DUP Zabjelo 5', s: 'adopted' } ]
};

/* ---------- map geometry (hand-authored, SVG units ~ metres/2) ---------- */
/* the city is divided into blocks; each block belongs to a zone and holds parcels */
const VIEW = { w: 1000, h: 720 };

/* zone regions (big polygons) keyed by id, with a doc-set + params */
const ZONES = [
  { id:'A', type:'res', doc:'A', name:'Blok VII — Stari Aerodrom', pts:'120,90 360,80 380,250 300,300 130,290',
    far:2.4, cov:40, floors:'P+5+Pk', use:'Residential / mixed', price:1650 },
  { id:'B', type:'mix', doc:'B', name:'Centar — Zona C2', pts:'380,80 640,95 660,250 400,255 380,250',
    far:3.2, cov:55, floors:'P+8', use:'Mixed use — commercial ground floor', price:2450 },
  { id:'C', type:'res', doc:'C', name:'Konik — Sjever', pts:'130,300 300,305 320,470 150,500 110,400',
    far:1.8, cov:35, floors:'P+3', use:'Residential', price:1180 },
  { id:'D', type:'grn', doc:'D', name:'Gorica Park', pts:'660,95 880,110 900,300 700,290 660,250',
    far:0.2, cov:5, floors:'P', use:'Green / recreation — protected', price:0 },
  { id:'E', type:'res', doc:'E', name:'Zabjelo', pts:'320,300 640,260 700,290 720,500 340,520 320,470',
    far:2.0, cov:38, floors:'P+4', use:'Residential', price:1420 },
  { id:'F', type:'com', doc:'B', name:'Poslovna zona — Istok', pts:'720,300 900,300 910,520 740,510 720,500',
    far:2.8, cov:60, floors:'P+6', use:'Commercial / business', price:1980 },
  { id:'G', type:'pub', doc:'A', name:'Institucionalni blok', pts:'150,500 340,520 330,640 160,630',
    far:1.5, cov:45, floors:'P+3', use:'Public / institutional', price:0 }
];

/* uncovered strip (no adopted plan) — south-west corner */
const UNCOVERED = '110,400 150,500 160,630 40,620 40,410';

/* SELECTABLE AREAS = coverage areas of planning documents (not planning zones).
   Several planning zones can sit inside one document's coverage area. */
const DOCLABEL = { A:'DUP Blok VII — Stari Aerodrom', B:'DUP Centar — Zona C2', C:'DUP Konik',
                   D:'DUP Gorica park', E:'DUP Zabjelo' };
const DOCAREAS = {};
ZONES.forEach(z=>{ (DOCAREAS[z.doc] = DOCAREAS[z.doc] || {id:z.doc,label:DOCLABEL[z.doc]||z.doc,zones:[]}).zones.push(z); });

/* build parcels inside each zone by subdividing its bounding area into a grid,
   clipping to the polygon. Each parcel gets a cadastral outline and a smaller
   planned outline (land taken for roads / public space). */
function polyBounds(pts){
  const c = pts.trim().split(/\s+/).map(p=>p.split(',').map(Number));
  const xs=c.map(p=>p[0]), ys=c.map(p=>p[1]);
  return {minx:Math.min(...xs),maxx:Math.max(...xs),miny:Math.min(...ys),maxy:Math.max(...ys),poly:c};
}
function pointInPoly(x,y,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>y)!=(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

let PARCELS = [];
let PID = 1000;
function buildParcels(){
  PARCELS = [];
  ZONES.forEach(z=>{
    if(z.type==='grn'||z.type==='pub') { return; } // parks/institutions: not subdivided into saleable parcels
    const b = polyBounds(z.pts);
    const step = 34;
    let idx=0;
    for(let gy=b.miny; gy<b.maxy; gy+=step){
      for(let gx=b.minx; gx<b.maxx; gx+=step){
        const cx=gx+step/2, cy=gy+step/2;
        if(!pointInPoly(cx,cy,b.poly)) continue;
        // cadastral rect with slight jitter
        const pad=2.2+Math.random()*1.6;
        // real blocks mix large and small plots — vary the plot size within the cell
        const sf = Math.random()<0.42 ? 0.58+Math.random()*0.22 : 0.92+Math.random()*0.08;
        const x=gx+pad, y=gy+pad,
              w=(step-pad*2-Math.random()*3)*sf, h=(step-pad*2-Math.random()*3)*sf;
        if(w<9||h<9) continue;
        // planned parcel: land taken on the street side (top/left) — smaller
        const take = 0.14 + Math.random()*0.16; // 14–30% reduction
        const px=x + w*take*0.6, py=y + h*take*0.6, pw=w*(1-take), ph=h*(1-take);
        const cadArea = Math.round(w*h*1.6);   // ≈ 230–1,450 m², so both price tiers occur
        const planArea = Math.round(pw*ph*1.6);
        PID++;
        idx++;
        PARCELS.push({
          id: PID, zone: z.id, ztype: z.type,
          num: (z.id.charCodeAt(0)-64)*1000 + idx, // parcel number (cadastral ref)
          sub: Math.random()<0.25 ? Math.ceil(Math.random()*3) : null,
          katOp: ['Podgorica I','Podgorica II','Podgorica III'][Math.floor(Math.random()*3)],
          block: z.id + '-' + String(Math.ceil(idx/4)).padStart(2,'0'),
          up: Math.random()<0.87 ? 'UP ' + z.id + String(Math.ceil(idx/4)).padStart(2,'0') + '.' + (((idx-1)%4)+1) : null,
          x,y,w,h, px,py,pw,ph, cadArea, planArea,
          publicOwn: Math.random()<0.12,
          restit: Math.random()<0.08
        });
      }
    }
  });
}
buildParcels();

/* urban block extents, derived from their parcels */
let BLOCKBOX={};
function buildBlocks(){
  BLOCKBOX={};
  PARCELS.forEach(p=>{
    const b=BLOCKBOX[p.block]||(BLOCKBOX[p.block]={minx:1e9,miny:1e9,maxx:-1e9,maxy:-1e9});
    b.minx=Math.min(b.minx,p.x); b.miny=Math.min(b.miny,p.y);
    b.maxx=Math.max(b.maxx,p.x+p.w); b.maxy=Math.max(b.maxy,p.y+p.h);
  });
}
buildBlocks();

/* ---------- market/cost model (deterministic, ranges) ---------- */
function feasibility(parcel, zone, assume){
  const A = parcel.planArea;              // planned parcel area drives everything
  const far = zone.far, cov = zone.cov;
  const gfa = Math.round(A * far);
  const coverage = Math.round(A * cov/100);
  const saleablePct = assume.saleable/100;
  const saleable = Math.round(gfa * saleablePct);
  const landVal = Math.round(A * zone.price * 0.55);          // land acquisition
  const design = Math.round(gfa * 90);                        // design & documentation
  const constr = Math.round(gfa * assume.constr);             // construction
  const mktUnit = assume.sale;                                // sale €/m²
  const marketVal = Math.round(saleable * mktUnit);
  const costTotal = landVal + design + constr;
  const profit = marketVal - costTotal;
  const roi = costTotal>0 ? (profit/costTotal*100) : 0;
  const band = v => ({ lo: Math.round(v*0.86), ex: Math.round(v), hi: Math.round(v*1.15) });
  return {
    gfa, coverage, saleable, landVal, design, constr, marketVal, costTotal, profit,
    roi, roiLo: roi-6.5, roiHi: roi+7.5,
    marketBand: band(marketVal), profitBand: band(profit), constrBand: band(constr), landBand: band(landVal)
  };
}

let DRAGGED=false; // true while the map is being panned, so a drag never selects
/* ---------- app state ---------- */
const STATE = {
  sel: null,          // selected parcel
  selMode: 'cad',     // 'cad' = cadastral parcel, 'urban' = urban parcel
  selDoc: null,       // selected planning-document coverage area
  selZone: null,
  paidMarket: false,  // has market-data subscription
  paidAI: false,      // unlimited AI
  aiQuota: 3,
  railOpen: true,
  layers: Object.fromEntries(LAYERS.map(l=>[l.id,l.on])),
  orderType: 'individual', // 'individual' | 'legal'
  assume: { constr: 780, sale: 2200, saleable: 70 } // editable assumptions
};

/* ============================================================
   RENDER: app chrome (topbar, rail, map, panel, ai, admin)
   ============================================================ */
function renderApp(){

  app.innerHTML = `

/* ============================================================
   MAP: build the SVG cadastre
   ============================================================ */
function renderMap(){
  const svg = $('#map');
  const NS='http://www.w3.org/2000/svg';
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  svg.innerHTML='';

  // paper texture bg
  svg.appendChild(mk('rect',{x:0,y:0,width:VIEW.w,height:VIEW.h,fill:'#EEF1F5'}));

  // uncovered area (rendered flat, base only)
  const unc = mk('polygon',{points:UNCOVERED,fill:'#E6E9EE',stroke:'#DCE1E8','stroke-width':1});
  unc.setAttribute('id','uncovered'); svg.appendChild(unc);

  // river (Morača) diagonal
  svg.appendChild(mk('path',{d:'M-20,120 C120,180 180,260 260,360 C320,440 300,560 360,740 L410,740 C360,560 380,440 320,360 C250,250 190,180 40,120 Z',class:'river'}));
  svg.appendChild(mk('path',{d:'M-20,120 C120,180 180,260 260,360 C320,440 300,560 360,740',class:'riverline'}));

  // ZONE fills
  const gZones = mk('g',{id:'gzones'}); svg.appendChild(gZones);
  ZONES.forEach(z=>{
    const t=ZTYPES[z.type];
    gZones.appendChild(mk('polygon',{points:z.pts,fill:t.hex,'fill-opacity':STATE.layers.zones?0.24:0,
      stroke:'none',class:'zone','data-zone':z.id}));
  });
  // planning-zone boundaries
  if(STATE.layers.zones){
    ZONES.forEach(z=>{ gZones.appendChild(mk('polygon',{points:z.pts,class:'zoneline',stroke:ZTYPES[z.type].hex})); });
  }

  // roads (major grid + ring)
  const gRoads=mk('g',{id:'groads',opacity:STATE.layers.base?1:0.15}); svg.appendChild(gRoads);
  [['M120,90 L900,110'],['M110,300 L910,300'],['M130,300 L340,640'],['M380,80 L400,520'],
   ['M660,95 L740,510'],['M120,90 L160,630']].forEach(d=>gRoads.appendChild(mk('path',{d:d[0],class:'road major'})));
  for(let x=180;x<900;x+=70) gRoads.appendChild(mk('path',{d:`M${x},85 L${x+30},640`,class:'road minor'}));
  for(let y=140;y<620;y+=55) gRoads.appendChild(mk('path',{d:`M110,${y} L910,${y-10}`,class:'road minor'}));

  // planned traffic (extra, only when layer on)
  if(STATE.layers.traffic){
    const gt=mk('g',{}); svg.appendChild(gt);
    ['M120,200 L900,215','M500,80 L520,640'].forEach(d=>gt.appendChild(mk('path',{d,stroke:'#5b5b5b','stroke-width':6,'stroke-dasharray':'10 6',fill:'none','stroke-opacity':.55})));
  }

  // land use tint (when on)
  if(STATE.layers.landuse){
    ZONES.forEach(z=>{const t=ZTYPES[z.type];
      svg.appendChild(mk('polygon',{points:z.pts,fill:t.hex,'fill-opacity':.32,stroke:'none','pointer-events':'none'}));});
  }

  // heatmaps
  if(STATE.layers.heatFAR){
    const gh=mk('g',{class:'heatcell'}); svg.appendChild(gh);
    ZONES.forEach(z=>gh.appendChild(mk('polygon',{points:z.pts,
      fill:`rgba(198,107,74,${0.15+(z.far/3.4)*0.55})`,stroke:'none','pointer-events':'none'})));
  }
  if(STATE.layers.heatMkt && STATE.paidMarket){
    const gm=mk('g',{class:'heatcell'}); svg.appendChild(gm);
    ZONES.forEach(z=>gm.appendChild(mk('polygon',{points:z.pts,
      fill:priceBand(z.price).col,stroke:'none','pointer-events':'none'})));
  }

  // PLANNING-DOCUMENT COVERAGE AREAS — these are the selectable areas
  if(STATE.layers.docareas){
    const gd=mk('g',{id:'gdocs'}); svg.appendChild(gd);
    Object.values(DOCAREAS).forEach(da=>{
      da.zones.forEach(z=>{
        const poly=mk('polygon',{points:z.pts,class:'docarea'+(STATE.selDoc===da.id?' sel':''),'data-doc':da.id});
        const ttl=mk('title',{}); ttl.textContent=da.label+' — click to open this planning document';
        poly.appendChild(ttl);
        poly.addEventListener('click',e=>{ if(DRAGGED)return; e.stopPropagation(); selectDoc(da.id); });
        gd.appendChild(poly);
      });
    });
  }

  // PARCELS
  const gParc=mk('g',{id:'gparcels'}); svg.appendChild(gParc);
  if(STATE.layers.cadastre){
    PARCELS.forEach(p=>{
      const t=ZTYPES[p.ztype];
      let fill = t.hex, op=0.5;
      if(STATE.layers.owner && p.publicOwn){ fill='#4F6D82'; op=0.7; }
      if(STATE.layers.restit && p.restit){ fill='#9E5568'; op=0.75; }
      const r=mk('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:1.5,fill:fill,'fill-opacity':op,class:'parcel','data-pid':p.id});
      const ct=mk('title',{}); ct.textContent='Cadastral parcel #'+p.num+(p.sub?'/'+p.sub:'')+(p.up?' → '+p.up:''); r.appendChild(ct);
      r.addEventListener('click',e=>{ if(DRAGGED)return; e.stopPropagation(); selectParcel(p.id,'cad'); });
      gParc.appendChild(r);
    });
  }

  // URBAN PARCELS — clickable in their own right
  if(STATE.layers.planned){
    const gp=mk('g',{id:'gplanned'}); svg.appendChild(gp);
    PARCELS.forEach(p=>{
      if(!p.up) return;
      const r=mk('rect',{x:p.px,y:p.py,width:p.pw,height:p.ph,rx:1,class:'uparcel','data-upid':p.id});
      const ut=mk('title',{}); ut.textContent=p.up+' — urban parcel (building rights)'; r.appendChild(ut);
      r.addEventListener('click',e=>{ if(DRAGGED)return; e.stopPropagation(); selectParcel(p.id,'urban'); });
      gp.appendChild(r);
    });
  }

  // urban block boundaries + labels (part of the planning-zones layer)
  if(STATE.layers.zones){
    const gb=mk('g',{id:'gblocks'}); svg.appendChild(gb);
    Object.keys(BLOCKBOX).forEach(name=>{
      const b=BLOCKBOX[name];
      gb.appendChild(mk('rect',{x:b.minx-3.5,y:b.miny-3.5,width:(b.maxx-b.minx)+7,height:(b.maxy-b.miny)+7,rx:2,class:'blockline'}));
      gb.appendChild(mk('text',{x:b.minx-2.5,y:b.miny-5.5,class:'blocklabel'})).textContent=name;
    });
  }

  // zone labels
  ZONES.forEach(z=>{
    const b=polyBounds(z.pts);
    const tx=mk('text',{x:(b.minx+b.maxx)/2,y:(b.miny+b.maxy)/2,'text-anchor':'middle',
      'font-family':'Schibsted Grotesk','font-size':13,'font-weight':600,fill:'rgba(42,33,24,.5)','pointer-events':'none'});
    tx.textContent=z.name.split('—')[0].trim(); svg.appendChild(tx);
  });

  // selection pin group
  svg.appendChild(mk('g',{id:'gpin'}));

  // click empty map → drop a pin at that point (coords, no parcel)
  svg.onclick=(e)=>{ if(!DRAGGED) pinEmpty(e); };

  restoreSelectionHighlight();
}

/* view-coordinate helpers (respect zoom / pan / viewBox slice) */
function clientToView(clientX,clientY){
  const svg=$('#map'); const m=svg.getScreenCTM(); if(!m)return null;
  const pt=svg.createSVGPoint(); pt.x=clientX; pt.y=clientY;
  const v=pt.matrixTransform(m.inverse());
  return { x:Math.max(0,Math.min(VIEW.w,v.x)), y:Math.max(0,Math.min(VIEW.h,v.y)) };
}
function coordStr(x,y){ return `42.4${(410+y/9|0)}° N · 19.2${(600+x/9|0)}° E`; }

/* free pin: user clicked the map but not a parcel */
function pinEmpty(e){
  const v=clientToView(e.clientX,e.clientY); if(!v)return;
  STATE.sel=null; STATE.selZone=null; STATE.selDoc=null; STATE.selMode='cad';
  STATE.freePin=v;
  document.querySelectorAll('.parcel.sel,.uparcel.sel,.docarea.sel').forEach(n=>n.classList.remove('sel'));
  $('#coords').textContent=coordStr(v.x,v.y);
  drawPinAt(v.x,v.y);
  renderPanelEmpty(v);
  $('#panel').classList.remove('hidden');
}

function restoreSelectionHighlight(){
  document.querySelectorAll('.parcel.sel,.uparcel.sel').forEach(n=>n.classList.remove('sel'));
  if(STATE.sel){
    const sel=STATE.selMode==='urban'
      ? document.querySelector(`.uparcel[data-upid="${STATE.sel.id}"]`)
      : document.querySelector(`.parcel[data-pid="${STATE.sel.id}"]`);
    if(sel){ sel.classList.add('sel'); sel.parentNode.appendChild(sel); }
    drawPin(STATE.sel);
  } else if(STATE.freePin){
    drawPinAt(STATE.freePin.x, STATE.freePin.y);
  }
}
function drawPin(p){
  drawPinAt(p.px+p.pw/2, p.py+p.ph/2);
}
function drawPinAt(cx,cy){
  const g=$('#gpin'); if(!g)return; g.innerHTML='';
  const NS='http://www.w3.org/2000/svg';
  const pin=document.createElementNS(NS,'path');
  pin.setAttribute('d',`M${cx},${cy-26} c-7,0 -12,5 -12,12 c0,9 12,20 12,20 c0,0 12,-11 12,-20 c0,-7 -5,-12 -12,-12 z`);
  pin.setAttribute('fill','#B5613B'); pin.setAttribute('stroke','#ffffff'); pin.setAttribute('stroke-width','1.5');
  pin.setAttribute('class','pin');
  const dot=document.createElementNS(NS,'circle');
  dot.setAttribute('cx',cx);dot.setAttribute('cy',cy-14);dot.setAttribute('r','3.6');dot.setAttribute('fill','#ffffff');
  g.appendChild(pin);g.appendChild(dot);
}

/* ============================================================
   LAYER RAIL
   ============================================================ */
function swatchHTML(sw){
  if(sw==='zones') return `<div class="swatch" style="background:conic-gradient(#B5744A,#BE9A44,#8A7A8E,#5E8A82,#7C8A4F)"></div>`;
  if(sw==='dash') return `<div class="swatch" style="background:#fff;border:1.5px dashed #B5613B"></div>`;
  if(sw==='docdash') return `<div class="swatch" style="background:#fff;border:2px dashed #B3A894"></div>`;
  if(sw==='blockdash') return `<div class="swatch" style="background:#fff;border:1.5px dotted #B3A894"></div>`;
  if(sw==='heat1') return `<div class="swatch" style="background:linear-gradient(135deg,#EFE3CE,#B4744A)"></div>`;
  if(sw==='heat2') return `<div class="swatch" style="background:linear-gradient(135deg,#F1E7CF,#B5853F)"></div>`;
  return `<div class="swatch" style="background:${sw}"></div>`;
}
const GRPLABEL={base:'Base',parcels:'Parcels',context:'Context',feas:'Feasibility'};
function renderRail(){
  const rail=$('#rail'); rail.innerHTML='';
  rail.classList.toggle('collapsed', !STATE.railOpen);
  if(!STATE.railOpen){
    const opener=el('button','railopen','<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 3h12M2 8h12M2 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>');
    opener.title='Show map layers';
    opener.addEventListener('click',()=>{ STATE.railOpen=true; renderRail(); });
    rail.appendChild(opener);
    return;
  }
  const head=el('div','railhead',
    `<b>Map layers</b><button class="railtog" title="Collapse"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M9.5 3L5 7.5l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`);
  head.querySelector('.railtog').addEventListener('click',()=>{ STATE.railOpen=false; renderRail(); });
  rail.appendChild(head);
  let lastGrp='';
  LAYERS.forEach(l=>{
    if(l.grp!==lastGrp){ rail.appendChild(el('div','rlabel',GRPLABEL[l.grp])); lastGrp=l.grp; }
    const on=STATE.layers[l.id];
    const reqL = l.req ? LAYERS.find(x=>x.id===l.req) : null;
    const dep = !!(reqL && !STATE.layers[l.req]);
    const locked = !!(l.paid && !STATE.paidMarket);
    const b=el('button',`lyr${on&&!locked?' on':''}${l.core?' core':''}${dep?' dep':''}${locked?' paidlayer':''}`,
      `${swatchHTML(l.sw)}<span class="lyrtext"><span class="nm">${l.name}</span>${locked?`<span class="subnm lockedsub">Subscription</span>`:l.sub?`<span class="subnm">${l.sub}</span>`:''}</span>
       <span class="chk"><svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 4l2 2 4-5" stroke="#fff" stroke-width="1.5" fill="none"/></svg></span>
       ${l.core?'<span class="lock">◆</span>':''}${dep?'<span class="depwarn">▲</span>':''}
       ${locked?'<span class="paidlock"><svg width="9" height="9" viewBox="0 0 12 12" fill="none"><rect x="2" y="5.4" width="8" height="5.4" rx="1.2" fill="currentColor"/><path d="M4 5.4V4a2 2 0 014 0v1.4" stroke="currentColor" stroke-width="1.3"/></svg></span>':''}`);
    b.title = l.core ? l.name+' (core layer, always on)'
      : locked ? l.name+' — included with the market-data subscription'
      : reqL ? l.name+' — shades cadastral parcels, so it only shows when “'+reqL.name+'” is on'
      : 'Toggle '+l.name;
    b.addEventListener('click',()=>{
      if(l.core) { toast('Core layer — always visible'); return; }
      if(l.paid && !STATE.paidMarket){ openUpgrade('market'); return; }
      STATE.layers[l.id]=!STATE.layers[l.id];
      if(STATE.layers[l.id] && reqL && !STATE.layers[l.req])
        toast(l.name+' shades cadastral parcels — turn on “'+reqL.name+'” to see it');
      renderRail(); renderMap(); renderLegend();
    });
    rail.appendChild(b);
    if(on && dep){
      const n=el('div','depnote',`Needs<b>${reqL.name}</b>tap to turn on`);
      n.title='Turn on '+reqL.name;
      n.addEventListener('click',()=>{ STATE.layers[l.req]=true; renderRail(); renderMap(); renderLegend();
        toast(reqL.name+' turned on'); });
      rail.appendChild(n);
    }
  });
}

/* ---------- legend ---------- */
function renderLegend(){
  const lg=$('#legend');
  const L=STATE.layers;
  const needCad = L.cadastre ? '' : ' — needs cadastral parcels';
  const secs=[];
  if(L.docareas) secs.push({t:'Planning documents', rows:[['docdash','Coverage area — click to open']]});
  if(L.zones) secs.push({t:'Urban zones', rows:[
    ...Object.values(ZTYPES).map(z=>[z.hex,z.name]),
    ['blockdash','Urban block boundary']
  ]});
  if(L.cadastre) secs.push({t:'Cadastral parcels', rows:[['cadsw','Parcel outline']]});
  if(L.planned) secs.push({t:'Urban parcels', rows:[['dash','Parcel — click to open']]});
  if(L.owner) secs.push({t:'Public ownership', rows:[['#4F6D82','Publicly owned'+needCad]]});
  if(L.restit) secs.push({t:'Restitution / legal', rows:[['#9E5568','Legal claim'+needCad]]});
  if(L.landuse) secs.push({t:'Land use', rows:Object.values(ZTYPES).map(z=>[z.hex,z.name])});
  if(L.heatFAR) secs.push({t:'FAR intensity', unit:'floor area ratio', rows:[['grad:#F1E7D6,#B5613B','Low → high']]});
  if(L.traffic) secs.push({t:'Planned traffic', rows:[['line:#5b5b5b','Planned route']]});
  if(L.heatMkt && STATE.paidMarket) secs.push({t:'Price heatmap', unit:'€/m² land', rows:PRICE_BANDS.map(b=>[b.col,b.label])});

  const mark = c =>
      c.startsWith('line:') ? `<span class="sw line" style="--lc:${c.slice(5)}"></span>`
    : c.startsWith('grad:') ? `<span class="sw" style="width:26px;flex:0 0 26px;border-radius:3px;background:linear-gradient(90deg,${c.slice(5)})"></span>`
    : c==='dash' ? `<span class="sw" style="background:#fff;border:1.5px dashed #B5613B"></span>`
    : c==='docdash' ? `<span class="sw" style="background:#fff;border:2px dashed #B3A894"></span>`
    : c==='blockdash' ? `<span class="sw" style="background:#fff;border:1.5px dotted #B3A894"></span>`
    : c==='cadsw' ? `<span class="sw" style="background:#fff;border:1.5px solid #B3A894"></span>`
    : `<span class="sw" style="background:${c}"></span>`;

  const body = secs.map(s=>
    `<div class="leggrp"><div class="legh">${s.t}${s.unit?` <span class="legu">${s.unit}</span>`:''}</div>`+
    s.rows.map(([c,n])=>`<div class="legrow">${mark(c)}${n}</div>`).join('')+
    `</div>`).join('');

  lg.innerHTML=`<h4>Legend <button id="legmin">–</button></h4><div class="legbody">${
    body||'<div class="legrow" style="opacity:.6">No overlays active</div>'
  }</div>`;
  $('#legmin').addEventListener('click',e=>{e.stopPropagation();lg.classList.toggle('min');
    e.target.textContent=lg.classList.contains('min')?'+':'–';});
}

function selectParcel(id,mode){
  const p=PARCELS.find(x=>x.id===id); if(!p)return;
  mode = (mode==='urban' && p.up) ? 'urban' : 'cad';
  STATE.sel=p; STATE.selMode=mode; STATE.selZone=null; STATE.selDoc=null; STATE.freePin=null;
  $('#coords').textContent=`42.4${(410+p.y/9|0)}° N · 19.2${(600+p.x/9|0)}° E`;
  renderMap(); renderPanel(); $('#panel').classList.remove('hidden');
}
window.selectParcel=selectParcel;
function selectDoc(id){
  const da=DOCAREAS[id]; if(!da)return;
  STATE.selDoc=id; STATE.sel=null; STATE.selZone=null; STATE.freePin=null;
  const g=$('#gpin'); if(g)g.innerHTML='';
  renderMap(); renderPanelDoc(da); $('#panel').classList.remove('hidden');
}
window.selectDoc=selectDoc;
function selectZone(id){
  const z=ZONES.find(x=>x.id===id); if(!z)return;
  STATE.selZone=z; STATE.sel=null; STATE.freePin=null;
  renderMap(); renderPanelZone(z); $('#panel').classList.remove('hidden');
}
function clearSelection(){
  const had = STATE.sel||STATE.selDoc;
  STATE.sel=null; STATE.selZone=null; STATE.selDoc=null; STATE.selMode='cad'; STATE.freePin=null;
  const g=$('#gpin'); if(g)g.innerHTML='';
  document.querySelectorAll('.parcel.sel,.uparcel.sel,.docarea.sel').forEach(n=>n.classList.remove('sel'));
  if(had) renderMap();
  renderPanelEmpty();
}

function aiReply(q){
  const p=STATE.sel, z=p?ZONES.find(z=>z.id===p.zone):null;
  const ql=q.toLowerCase();
  if(z&&(ql.includes('build')||ql.includes('what can'))){
    const f=feasibility(p,z,STATE.assume);
    return {who:'bot',text:`On parcel #${p.num}, the adopted plan allows land use "${z.use.split('—')[0].trim()}", up to ${z.floors}, ${z.cov}% site coverage and FAR ${z.far.toFixed(1)}. On the planned area of ${fmt(p.planArea)} m² that's about <b>${fmt(f.gfa)} m² of gross floor area</b>.`,cite:(DOCS[z.doc]||[{n:''}])[0].n};
  }
  if(ql.includes('far')||ql.includes('coverage')){
    return {who:'bot',text:`FAR (Floor Area Ratio, locally II) caps total floor area as a multiple of parcel area. Coverage (IZ) caps the building's footprint as a % of the parcel. ${z?`Here: FAR ${z.far.toFixed(1)}, coverage ${z.cov}%.`:''}`,cite:z?(DOCS[z.doc]||[{n:''}])[0].n:'Planning glossary'};
  }
  if((ql.includes('planned')&&ql.includes('smaller'))||ql.includes('why is the planned')){
    return {who:'bot',text:p?`The plan reparcels land — some of the cadastral parcel is taken for roads and public space. Here the cadastral ${fmt(p.cadArea)} m² becomes a planned ${fmt(p.planArea)} m². You can only build on the planned area, so every calculation uses it.`:`Select a parcel and I can compare its cadastral and planned areas.`,cite:'Existing vs planned'};
  }
  if(ql.includes('worth')||ql.includes('roi')||ql.includes('profit')){
    if(!STATE.paidMarket) return {who:'bot',text:`Whether it's worth developing comes from the market data — land value, build cost, sale value and ROI. That's part of the market-data subscription. I can explain what each figure means for free.`,cite:null};
    const f=feasibility(p,z,STATE.assume);
    return {who:'bot',text:`Indicatively, expected ROI here is about <b>${f.roi.toFixed(0)}%</b> (range ${f.roiLo.toFixed(0)}–${f.roiHi.toFixed(0)}%), on ~${eur(f.profit)} potential profit. Ranges reflect market uncertainty — treat as indicative, not advice.`,cite:'Realitica · Monstat'};
  }
  return {who:'bot',text:p?`For parcel #${p.num} I can explain the planning parameters, the existing-vs-planned difference, or what the plan permits. What would you like to know?`:`Select a parcel on the map and I can walk you through what the plan allows and what it means.`,cite:null};
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t=$('#toast');
  t.innerHTML=`<span class="ti">✦</span> ${msg}`;
  t.classList.add('on'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('on'),2600);

/* ---------- map zoom & pan ---------- */
const ZMIN=0.4, ZMAX=6;
let zoom=1, panX=0, panY=0;
function applyZoom(){
  const g=$('#map'); if(!g)return;
  const wrap=g.parentElement;
  zoom=Math.max(ZMIN,Math.min(ZMAX,zoom));
  if(zoom>=1){
    panX=Math.min(0,Math.max(-wrap.clientWidth*(zoom-1),panX));
    panY=Math.min(0,Math.max(-wrap.clientHeight*(zoom-1),panY));
  } else {
    // zoomed out past the city framing → centre Podgorica within the broader field
    panX=wrap.clientWidth*(1-zoom)/2;
    panY=wrap.clientHeight*(1-zoom)/2;
  }
  g.style.transformOrigin='0 0';
  g.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  const zl=$('#zlabel'); if(zl) zl.textContent=zoom.toFixed(1)+'×';
}
/* zoom keeping the point under the cursor fixed */
function zoomAt(cx,cy,factor){
  const nz=Math.max(ZMIN,Math.min(ZMAX,zoom*factor));
  const k=nz/zoom;
  panX=cx-k*(cx-panX); panY=cy-k*(cy-panY);
  zoom=nz; applyZoom();
}
function wireMapTools(){
  const wrap=$('#map').parentElement;
  const ctr=fn=>{ fn(wrap.clientWidth/2, wrap.clientHeight/2); };
  $('#zin').addEventListener('click',()=>ctr((x,y)=>zoomAt(x,y,1.4)));
  $('#zout').addEventListener('click',()=>ctr((x,y)=>zoomAt(x,y,1/1.4)));
  $('#zreset').addEventListener('click',()=>{zoom=1;panX=0;panY=0;applyZoom();clearSelection();});
  const home=$('#homePill');
  if(home) home.addEventListener('click',()=>{ zoom=1;panX=0;panY=0;applyZoom(); toast('Centred on Podgorica'); });

  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=wrap.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*0.0018));
  },{passive:false});

  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  wrap.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    dragging=true; DRAGGED=false; sx=e.clientX; sy=e.clientY; ox=panX; oy=panY;
  });
  wrap.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!DRAGGED && (Math.abs(dx)>3||Math.abs(dy)>3)){
      DRAGGED=true; wrap.classList.add('drag');
      try{ wrap.setPointerCapture(e.pointerId); }catch(_){}   // capture only once a real drag starts,
    }                                                          // so a plain click still reaches the parcel
    if(DRAGGED && zoom>1){ panX=ox+dx; panY=oy+dy; applyZoom(); }
  });
  const end=()=>{ dragging=false; wrap.classList.remove('drag'); };
  wrap.addEventListener('pointerup',end);
  wrap.addEventListener('pointercancel',end);
  wrap.addEventListener('pointerleave',end);
  window.addEventListener('resize',applyZoom);
}
