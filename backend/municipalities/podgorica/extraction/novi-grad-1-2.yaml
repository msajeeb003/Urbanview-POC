# Extraction rules: DUP "Novi Grad 1 i 2" (izmjene i dopune), build plan ticket 07.
#
# Written with `python -m core.gis.extract styles` and the geometry assessment
# (docs/gis/assessment). Manual fixes go in this file (offsets, excluded regions, label
# overrides), never into the extracted data. Paths are relative to docs/gis/source for the CLI;
# the geometry job finds each sheet by its SHA-256 among the stored files.
document:
  id: novi-grad-1-2
  name: DUP Novi Grad 1 i 2 – izmjene i dopune
  registry: eRegistri (lamp.gov.me), DUP Novi Grad 1 i 2

sheets:
  - id: parcels
    file: 02 Novi Grad 1 i 2/Novi Grad 1 i 2 - Urban parcels - Boundaries.pdf
    sha256: 9e8f18274613215a23ba09c9cd0d6c79c94b16143e619503f080d11391ead4e7
    # the PDF viewport says 1:776; 68 grid crosses 100 mm apart prove the stated 1:1000
    scale: 1000
    # displayed (/Rotate 270) with north to the right: along Moskovska, Bulevar Revolucije, Sv. Petra
    # Cetinjskog and 13. jula follow each other from left to right, as they do northwards in
    # OpenStreetMap; the grid lattice is turned a further ~23 degrees
    north: right
    layers: [plan_boundary, urban_parcels, urban_blocks]
  - id: land-use
    file: 02 Novi Grad 1 i 2/Novi Grad 1 i 2 - Land use.pdf
    sha256: 2102020fc8102011fe39c28e6e2a98aed922ac5133ffc9427a09f9a056e9ca4d
    scale: 1000
    # plotted 0.7 m / 3.9 m off the parcel sheet: `offset --base parcels --sheet land-use
    # --pdf-layer '^PARCELE_GRANICE$'` (1021 of 1000 sampled vertices agree)
    offset_m: [0.72, -3.852]
    north: right  # plotted like the parcel sheet
    layers: [planned_land_use]

layers:
  # a thin red polyline with filled dots along it; the dots and their outlines are left out
  plan_boundary:
    method: polygonize
    select: [{layer: granica, filled: false, min_size_mm: 5}]
    gap_mm: 1.0
    min_area_m2: 10000

  # R-PARCELE draws the planned parcel boundaries 1.2 mm wide, but only for the parcels the
  # plan lays out anew (27 closed outlines). The parcel of an existing or planned building is
  # the building's own outline (OBJEKTI-POSTOJECI / OBJEKTI-NOVI) with the numbered parcel
  # vertices on its corners: the parameter table states these parcels with 100 % site coverage.
  # Where a planned parcel follows the cadastral base the plan leaves the edge to
  # PARCELE_GRANICE. All three are the fallback: they cut up only the open ground that holds
  # several labels, never a parcel R-PARCELE closes.
  #
  # `absorb: false`: the pieces between the buildings are streets, parking and yards, not parts
  # of a parcel (absorbed, they gave UP 18 59 000 m2 for the 1 387 m2 the table states).
  # `absorb_along`: a building of several segments is one parcel (UP 26, 44, 56): the segments
  # next to the labelled one, outlined by the building layers, join it.
  # `vertex_marks`: the thin R-PARCELE layer holds a small circle on every numbered parcel
  # vertex (433 of them; its other strokes are the numbers, written in a stroke font). Two
  # parcels inside one building outline (UP 14 / 15, UP 90 / 91) are divided only by those
  # vertices: the outline is cut along the shortest line between two of them that separates
  # the labels (69-70 and 432-433).
  # `gap_mm: 1`: closes the 1 mm openings some outlines are plotted with (UP 1).
  #
  # Check against the parameter table, 2026-10-02 (a dry run through staging and publish): 93
  # parcels, UP 14 and UP 90 among them for the first time; of the 90 with a stated area 85 are
  # within 2 % of it and 89 within 10 % (36 and 42 of 88 before these rules); UP 66 measures
  # 589 m2 for the 497 m2 stated (its shape is the building as drawn). UP 51, 81 and 85 have
  # sub-rows (a), (b) ... in the table and one parcel on the sheet; UP 82 is drawn as 82a-c.
  urban_parcels:
    method: polygonize
    select: [{layer: R-PARCELE, width_min: 3}]
    fallback:
      - {layer: OBJEKTI-POSTOJECI}
      - {layer: OBJEKTI-NOVI}
      - {layer: PARCELE_GRANICE, stroke: "#989898"}
    absorb: false
    absorb_along: [{layer: OBJEKTI-POSTOJECI}, {layer: OBJEKTI-NOVI}]
    vertex_marks: [{layer: R-PARCELE, width_max: 1}]
    gap_mm: 1.0
    closing: [plan_boundary]
    min_area_m2: 10
    keep: labelled
    labels:
      source: glyphs  # "UP 12" plotted as filled outlines
      select: [{layer: "!BROJEVI UP"}]
      pattern: 'UP\s*(\d+[a-z]?)'
      attribute: urban_parcel_number
      glyph_height_mm: [3.0, 5.0]  # the vertex table's glyphs are 1.7 mm
      max_distance_mm: 3

  # the block lines (a chain of 2 mm circles 3.5 mm apart) mark only the street axes between
  # blocks; the plan boundary closes the blocks outside. "BLOK A" ... "BLOK F" in glyph outlines
  urban_blocks:
    method: polygonize
    select: [{layer: blokovi}]
    gap_mm: 4.5
    extend_mm: 8  # the circles stop 4-6 mm short of the junctions and the boundary
    closing: [plan_boundary]
    min_area_m2: 1000
    keep: labelled
    labels:
      source: glyphs
      select: [{layer: BLOKOVI-OZNAKA}]
      pattern: 'BLOK\s*([A-F])'
      attribute: block_ref
      glyph_height_mm: [8.0, 16.0]
      glyph_chars: ABCDEFKLO
      font: hebo  # bold lettering: with Helvetica templates the O reads as D
      max_gap: 2.0  # "BLOK" and the letter are set wide apart

  # the land-use sheet hatches each area with lines of its category's colour: every planned
  # parcel takes the category covering most of it
  planned_land_use:
    method: classify
    classify_from: urban_parcels
    gap_mm: 1.5
    min_share: 0.3
    categories:
      - {code: SD, name: stanovanje sa djelatnostima, select: [{layer: SRAF_KOLEKTIVNO_SA_DEL}]}
      - {code: S, name: stanovanje, select: [{layer: SRAF_KOLEKTIVNO_STAN}]}
      - {code: CD, name: centralne djelatnosti, select: [{layer: SRAF_C.DJEL}]}
      - {code: MN, name: mješovita namjena, select: [{layer: SRAF_MJESOVITE}]}
      - {code: SK, name: školstvo i socijalna zaštita, select: [{layer: SRAF_OBRAZOVANJE}]}
      - {code: IS, name: površine saobraćajne infrastrukture, select: [{layer: SRAF_SAOBRACAJ}]}
      - {code: ZP, name: zelene površine, select: [{layer: SRAF_ZELENE_POVRSINE}]}

expected_parcels:
  pdf: 02 Novi Grad 1 i 2/Novi Grad 1 i 2 - Urban parcels - Planning parameters.pdf
  sha256: cd368d64de9d0f36554209fdc5ed6eb0317b3d0b4cd136fce7c656c177c9c089
  pattern: '\bUP\s*(\d+[a-z]?)\b'

# the parameter table's first two columns: Blok, Broj UP
parcel_blocks:
  table:
    pdf: 02 Novi Grad 1 i 2/Novi Grad 1 i 2 - Urban parcels - Planning parameters.pdf
    sha256: cd368d64de9d0f36554209fdc5ed6eb0317b3d0b4cd136fce7c656c177c9c089
    pattern: '(?m)^\s*([A-F])\s*\n\s*UP\s*(\d+[a-z]?)\s*$'

# The plan CRS (EPSG:3908, MGI 1901) to EPSG:4326. The live dataset was converted on the server
# with PROJ's own choice there, EPSG:9486 "MGI 1901 to WGS 84 (15)": measured 2026-10-02 on six
# parcels whose shape did not change, it reproduces the served coordinates to 3 mm, while an
# older PROJ (8.2: EPSG:3964) lands 2.8 m to the east-north-east. Written out here so every run
# puts the plan where the published data is, whatever PROJ decides. ogr2ogr feeds the pipeline
# easting, northing and expects EPSG:4326's own order back (latitude, longitude): hence the
# final axis swap. A wrong order cannot pass unnoticed: the staging refuses a dataset outside
# the municipality's extent.
georef:
  transform: >-
    +proj=pipeline
    +step +inv +proj=tmerc +lat_0=0 +lon_0=18 +k=0.9999 +x_0=6500000 +y_0=0 +ellps=bessel
    +step +proj=push +v_3
    +step +proj=cart +ellps=bessel
    +step +proj=helmert +x=577.84843 +y=165.45019 +z=390.43652
    +rx=-4.93131 +ry=0.96052 +rz=13.05072 +s=7.86546 +convention=coordinate_frame
    +step +inv +proj=cart +ellps=WGS84
    +step +proj=pop +v_3
    +step +proj=unitconvert +xy_in=rad +xy_out=deg
    +step +proj=axisswap +order=2,1
