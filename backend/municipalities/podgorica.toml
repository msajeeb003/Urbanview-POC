# Podgorica, Montenegro — the prototype municipality.
# Values marked "confirm" are provisional until the P0 week-1 gates (sample assessment, zone definition).

id = "podgorica"
name = "Podgorica"
country = "ME"
# The country by name: an order is paid from a bank here (the domestic account) or from abroad
# (IBAN and SWIFT); the order form's "Paying from" choice and the payment instructions name it.
country_name = "Montenegro"
country_name_local = "Crna Gora"
locale = "sr-Latn-ME"
currency = "EUR"
# Local date for effective-dated financial assumptions (a set dated 15 October applies from
# midnight in Podgorica).
timezone = "Europe/Podgorica"
serving_crs_epsg = 4326
# Planning documents are drawn in the state system, MGI 1901 / Balkans zone 6 (Gauss-Krüger 6):
# grid labels and parcel-vertex tables in the sample plans (week-1 geometry assessment,
# docs/gis/geometry-assessment.md). EPSG's only Montenegro transformation to WGS 84 (EPSG:3965) is
# good to 10 m, so georeferencing fits its own datum shift. UZN cadastral exports may come in
# ETRS89 / UTM 34N (MONREF97, EPSG:25834): confirm when bulk access is granted.
source_crs_epsg = 3908
center = [19.2636, 42.4411]             # lng, lat (city centre)
bounds = [19.10, 42.33, 19.45, 42.55]   # min_lng, min_lat, max_lng, max_lat — provisional urban extent, confirm with zone definition
cadastral_municipalities = ["Podgorica I", "Podgorica II", "Podgorica III"]   # placeholder — replace with the official KO list from UZN

# Sale-price choropleth bands (€/m²): not saleable (0) | under 1,300 | 1,300–1,700 | 1,700–2,100 |
# 2,100 and above — the approved wireframe's bands; confirm with the client's market data.
price_band_breaks_eur_m2 = [1300, 1700, 2100]

[terminology.site_coverage]
abbreviation = "IZ"
local_name = "indeks zauzetosti"
english = "maximum site coverage (%)"

[terminology.far]
abbreviation = "II"
local_name = "indeks izgrađenosti"
english = "floor area ratio"

[terminology.cadastral_municipality]
abbreviation = "KO"
local_name = "katastarska opština"
english = "cadastral municipality"

[terminology.urban_parcel]
abbreviation = "UP"
local_name = "urbanistička parcela"
english = "planned urban parcel"

[terminology.urban_block]
abbreviation = "Blok"
local_name = "urbanistički blok"
english = "urban block"

[terminology.document_types]
DUP = "Detaljni urbanistički plan (detailed urban plan)"
PUP = "Prostorno-urbanistički plan (spatial-urban plan)"
PGR = "Plan generalne regulacije (general regulation plan)"
UP = "Urbanistički projekat (urban project)"
# Types the eRegistri list and the zone reference also carry (data/zones/podgorica/zones.toml):
LSL = "Lokalna studija lokacije (local location study)"
DSL = "Državna studija lokacije (state location study)"
PPPN = "Prostorni plan posebne namjene (special-purpose spatial plan)"
DPP = "Detaljni prostorni plan (detailed spatial plan)"
PPCG = "Prostorni plan Crne Gore (spatial plan of Montenegro)"

# English names the public map shows after the abbreviation (the approved wireframe's copy)
[terminology.document_types_en]
DUP = "Detailed urban plan"
PUP = "General urban plan"
PGR = "General regulation plan"
UP = "Urban project"
LSL = "Local location study"
DSL = "State location study"
PPPN = "Special-purpose spatial plan"
DPP = "Detailed spatial plan"
PPCG = "Spatial plan of Montenegro"

